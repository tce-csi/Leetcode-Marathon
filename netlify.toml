# ---------------------------------------------------------------------------
# CodeQuest — Netlify Full-Stack Configuration
# Builds the Vite React SPA and packages the Express API as a serverless function.
# ---------------------------------------------------------------------------

[build]
  command = "npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/migrations/**"]

# API Proxy: Route all /api/* requests to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Client SPA: Fallback all other routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

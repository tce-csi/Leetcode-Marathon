<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="LeetCode Marathon — a level-based competitive coding contest organized by CSI TCE, the Computer Society of India Student Chapter at Thiagarajar College of Engineering."
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Light is the
      // default; visitors opt into dark explicitly.
      (function () {
        try {
          var stored = localStorage.getItem("cq-theme");
          var theme = stored === "dark" ? "dark" : "light";
          var root = document.documentElement;
          root.classList.toggle("dark", theme === "dark");
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0a0a0b" : "#ffffff");
        } catch (error) {
          /* no-op */
        }
      })();
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23101012'/%3E%3Cpath d='m8 6-5 6 5 6M16 6l5 6-5 6' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>LeetCode Marathon — A Coding Contest by CSI TCE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
